baseURL = "https://isabeldahlgren.github.io"
title = "Isabel Dahlgren"
theme = "lines"
languageCode = "en-US"
enableInlineShortcodes = true
pygmentsCodeFences = true
pygmentsUseClasses = true

[pagination]
  pagerSize = 999

[params]
  description = "Isabel Dahlgren"
  copyright = "Copyright © Isabel Dahlgren"
  dark = "on"
  highlight = true

[menu]

  [[menu.main]]
    identifier = "index"
    name       = "Posts"
    url        = "/"
    weight     = -111

  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 10

  [[menu.main]]
    identifier = "Links"
    name = "Links"
    url = "/links/"
    weight = 15

  [[menu.main]]
    identifier = "photos"
    name = "Photos"
    url = "/photos/"
    weight = 20

  [[menu.main]]
    identifier = "clock"
    name = "Clock"
    url = "/clock/"
    weight = 22


[permalinks]
  posts = "/:title/"

[markup.goldmark.renderer]
  unsafe = true

[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [["$$", "$$"]]
    inline = [["$", "$"]]

[outputs]
  home = ["HTML", "RSS"]

