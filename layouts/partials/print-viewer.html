<dialog class="print-viewer" aria-label="Work viewer">
  <form method="dialog"><button class="viewer-close" aria-label="Close work viewer">[ close ]</button></form>
  <div class="viewer-content">
    <img class="viewer-image" alt="">
    <div class="viewer-reading" tabindex="0" aria-label="Work text"></div>
  </div>
  <div class="viewer-caption" aria-live="polite"><p class="viewer-title"></p><p class="viewer-position"></p></div>
  <nav class="viewer-controls" aria-label="Browse series"><button type="button" class="viewer-prev">[ previous ]</button><button type="button" class="viewer-next">[ next ]</button></nav>
</dialog>
<script>
(() => {
  const dialog = document.querySelector('.print-viewer');
  const image = dialog.querySelector('.viewer-image');
  const reading = dialog.querySelector('.viewer-reading');
  const previous = dialog.querySelector('.viewer-prev');
  const next = dialog.querySelector('.viewer-next');
  let prints = [], index = 0;
  function show(i) {
    index = i;
    const print = prints[index];
    image.hidden = !print.dataset.image;
    if (print.dataset.image) image.src = print.dataset.image;
    else image.removeAttribute('src');
    image.alt = print.dataset.title;
    reading.replaceChildren();
    print.querySelectorAll('.print-artist, .print-writing').forEach(part => reading.append(part.cloneNode(true)));
    reading.hidden = !reading.children.length;
    reading.scrollTop = 0;
    dialog.classList.toggle('viewer-text-only', !print.dataset.image);
    dialog.querySelector('.viewer-title').textContent = print.dataset.title;
    dialog.querySelector('.viewer-position').textContent = `${print.dataset.series} · ${index + 1} / ${prints.length}`;
    previous.disabled = index === 0;
    next.disabled = index === prints.length - 1;
  }
  document.querySelectorAll('.print-open, .work-read').forEach(trigger => {
    trigger.addEventListener('click', event => {
      if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
      event.preventDefault();
      const work = trigger.closest('.print');
      // On touch devices, unload the 3D scene before decoding the full image.
      if (document.body.classList.contains('room-touch') || matchMedia('(pointer: coarse)').matches) {
        window.dispatchEvent(new Event('gallery:save-view'));
        location.assign(work.dataset.viewUrl);
        return;
      }
      prints = [...trigger.closest('.print-series').querySelectorAll('.print')];
      show(prints.indexOf(trigger.closest('.print')));
      dialog.showModal();
      document.body.classList.add('viewing-print');
    });
  });
  previous.addEventListener('click', () => { if (index > 0) show(index - 1); });
  next.addEventListener('click', () => { if (index < prints.length - 1) show(index + 1); });
  dialog.addEventListener('keydown', event => {
    if (event.key === 'ArrowLeft' && index > 0) { event.preventDefault(); show(index - 1); }
    if (event.key === 'ArrowRight' && index < prints.length - 1) { event.preventDefault(); show(index + 1); }
  });
  dialog.addEventListener('close', () => document.body.classList.remove('viewing-print'));
})();
</script>
