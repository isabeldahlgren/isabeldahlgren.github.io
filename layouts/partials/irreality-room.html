<div class="gallery-room" aria-label="Walkable print gallery">
  <div class="room-world"><div class="room-architecture" aria-hidden="true"></div></div>
</div>
<div class="room-heading"><h1>irreality</h1><p>an artificial gallery</p></div>
<p class="gallery-disclosure">this was obviously AI-generated; I can't sew</p>
<nav class="room-series" aria-label="Choose a print series"></nav>
<p class="room-view-hint">click a work to view</p>
<div class="room-controls" aria-label="Gallery controls">
  <div class="room-pad" role="group" aria-label="Walk">
    <button type="button" data-move="w" aria-label="Walk forward">W</button>
    <span><button type="button" data-move="a" aria-label="Walk left">A</button><button type="button" data-move="s" aria-label="Walk backward">S</button><button type="button" data-move="d" aria-label="Walk right">D</button></span>
  </div>
  <div class="room-pad" role="group" aria-label="Look around">
    <button type="button" data-move="arrowup" aria-label="Look up">↑</button>
    <span><button type="button" data-move="arrowleft" aria-label="Look left">←</button><button type="button" data-move="arrowdown" aria-label="Look down">↓</button><button type="button" data-move="arrowright" aria-label="Look right">→</button></span>
  </div>
</div>
<script defer src="{{ "js/irreality.js" | relURL }}"></script>
